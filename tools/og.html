<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #0a1633; color: #e6edf3; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; position: relative; overflow: hidden; }
  .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 55% 70% at 10% 0%, rgba(139,108,255,.38), transparent 70%), radial-gradient(ellipse 45% 60% at 95% 100%, rgba(251,146,60,.20), transparent 70%); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(#3d444d 1px, transparent 1px), linear-gradient(90deg, #3d444d 1px, transparent 1px); background-size: 60px 60px; opacity: .25; }
  .inner { position: relative; padding: 72px 80px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 650; }
  .brand img { width: 64px; height: 64px; border-radius: 50%; }
  h1 { font-size: 84px; line-height: 1.02; letter-spacing: -0.04em; max-width: 700px; }
  h1 span { background: linear-gradient(100deg, #2dd4bf, #8b6cff 55%, #fb923c); -webkit-background-clip: text; color: transparent; }
  .foot { display: flex; justify-content: space-between; color: #9198a1; font-size: 26px; }
</style>
</head>
<body>
<div class="glow"></div><div class="grid"></div>
<div class="inner">
  <div class="brand"><img src="../assets/logo.png" alt="">Taumatix</div>
  <h1>Libraries and tools you can <span>rely on</span>, and check.</h1>
  <img class="art" src="../assets/logo.png" alt="" style="position:absolute;right:70px;top:150px;width:330px;height:330px;border-radius:50%;filter:drop-shadow(0 20px 50px rgba(139,108,255,.5))">
  <div class="foot"><div>Go and Swift &middot; tested end to end &middot; upstream pins in the open</div><div>taumatix.dev</div></div>
</div>
</body>
</html>
